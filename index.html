<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Skills Test</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #fceff3;

    .container {
        background-color: #fff8fa;
        width: 350px;
        margin: auto;
        padding: 25px;
        border-radius: 15px;
    }

    h1 {
        color: #c77d9b;
    }

    label {
        color: #6d5360;
    }

    input[type="checkbox"] {
        accent-color: #e8a9bd;
    }

    button {
        background-color: #e8a9bd;
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 10px;
        cursor: pointer;
    }

    button:hover {
        background-color: #d995ad;
    }

    h2 {
        color: #c77d9b;
    }

    #receipt {
        background-color: #fff8fa;
        padding: 15px;
        border-radius: 10px;
        color: #6d5360;
    }
</style>
</head>
<body>

    <div class="container">

        <br>

        <input type="checkbox" id="TuronCream" value=60>

        <br>

    </div>

    <br>
    <button py-click="Order">Order</button>


        <h2>Receipt</h2>

        <div class="y2k-text">

        </div>

    </div>

    <script type="py" src="main.py"></script>
